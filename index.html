<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Il Gioco della Memoria 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --cream:#FAF6F0;
  --warm:#F2E8D9;
  --warmer:#E8D5BB;
  --terra:#B5603A;
  --terra-l:#D4845C;
  --terra-d:#8A4428;
  --sage:#7A9E82;
  --sage-l:#A5C4AC;
  --gold:#C9943A;
  --gold-l:#E8BF6A;
  --text:#2C1A0E;
  --text-m:#6B4C35;
  --text-l:#A07858;
  --white:#FFFFFF;
  --shadow:rgba(44,26,14,0.10);
  --shadow-d:rgba(44,26,14,0.18);
  --r:22px;
}
html{background:var(--cream);}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* ── TEXTURE BG ── */
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 80% 10%, #F2E8D966 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 10% 90%, #E8F2EA55 0%, transparent 70%);
  pointer-events:none;z-index:0;
}

.app{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:0 16px 60px;}

/* ── HEADER ── */
.header{padding:28px 0 10px;text-align:center;animation:fadeDown .5s ease both;}
.header-top{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px;}
.header h1{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;color:var(--terra);}
.header .petal{font-size:28px;}
.date-tag{display:inline-block;background:var(--warm);border:1.5px solid var(--warmer);border-radius:30px;padding:5px 16px;font-size:14px;font-weight:600;color:var(--text-m);letter-spacing:.3px;}
.streak-tag{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#FFF3E0,#FFE0B2);border:1.5px solid #FFCC80;border-radius:30px;padding:5px 14px;font-size:14px;font-weight:700;color:#E65100;margin-left:8px;}

/* ── NAV ── */
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:16px 0;background:var(--warm);padding:5px;border-radius:18px;animation:fadeUp .4s .1s ease both;}
.nav-btn{padding:12px 4px;border:none;border-radius:13px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;background:transparent;color:var(--text-l);line-height:1.3;text-align:center;}
.nav-btn .nav-icon{display:block;font-size:20px;margin-bottom:3px;}
.nav-btn.active{background:white;color:var(--terra);box-shadow:0 3px 12px var(--shadow-d);}

/* ── CARD ── */
.card{background:white;border-radius:var(--r);padding:24px 20px;box-shadow:0 6px 28px var(--shadow);margin-bottom:14px;border:1px solid rgba(181,96,58,.07);animation:fadeUp .35s ease both;}
.card-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--terra);margin-bottom:4px;}
.card-sub{font-size:14px;color:var(--text-l);margin-bottom:18px;}

/* ── QUIZ ── */
.quiz-progress{height:5px;background:var(--warm);border-radius:10px;margin-bottom:20px;overflow:hidden;}
.quiz-progress-bar{height:100%;background:linear-gradient(90deg,var(--terra),var(--terra-l));border-radius:10px;transition:width .4s ease;}
.quiz-icon{text-align:center;font-size:76px;margin-bottom:12px;display:block;animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both;}
.quiz-q{font-family:'Cormorant Garamond',serif;font-size:27px;text-align:center;line-height:1.3;margin-bottom:26px;color:var(--text);}
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{padding:18px 20px;border:2px solid var(--warm);border-radius:16px;background:white;font-family:'DM Sans',sans-serif;font-size:19px;font-weight:600;color:var(--text);cursor:pointer;transition:all .18s;text-align:left;}
.opt:active{transform:scale(.98);}
.opt.correct{background:#EDF7F0;border-color:#4CAF50;color:#1B5E20;}
.opt.wrong{background:#FDE8E4;border-color:#E57373;color:#7F0000;}
.opt.reveal{background:#EDF7F0;border-color:#4CAF50;color:#1B5E20;opacity:.7;}
.opt.disabled{cursor:not-allowed;}
.feedback-bar{margin-top:14px;padding:14px 18px;border-radius:14px;font-size:20px;font-weight:700;text-align:center;animation:popIn .3s ease both;}
.feedback-bar.ok{background:#EDF7F0;color:#2E7D32;}
.feedback-bar.ko{background:#FDE8E4;color:#C62828;}
.btn-next{width:100%;margin-top:12px;padding:18px;background:var(--terra);color:white;border:none;border-radius:16px;font-family:'DM Sans',sans-serif;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 5px 18px rgba(181,96,58,.35);transition:all .2s;}
.btn-next:active{transform:scale(.98);}
.btn-next.sage{background:var(--sage);box-shadow:0 5px 18px rgba(122,158,130,.35);}

/* ── MEMORY GAME ── */
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:4px;}
.mem-card{aspect-ratio:1;border-radius:14px;border:2px solid var(--warm);background:var(--warm);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:36px;transition:all .25s;position:relative;user-select:none;}
.mem-card .mem-back{font-size:24px;color:var(--text-l);position:absolute;}
.mem-card .mem-front{opacity:0;transition:opacity .2s;}
.mem-card.flipped{background:white;border-color:var(--terra-l);box-shadow:0 3px 12px var(--shadow);}
.mem-card.flipped .mem-back{opacity:0;}
.mem-card.flipped .mem-front{opacity:1;}
.mem-card.matched{background:linear-gradient(135deg,#EDF7F0,#D4EDDA);border-color:#81C784;cursor:default;}
.mem-card.matched .mem-front{opacity:1;}
.mem-card.shake{animation:shake .35s ease;}
.mem-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.mem-stat{text-align:center;}
.mem-stat .val{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;color:var(--terra);}
.mem-stat .lbl{font-size:12px;color:var(--text-l);font-weight:600;}

/* ── COMPLETA ── */
.frase-container{margin-bottom:20px;}
.frase-text{font-family:'Cormorant Garamond',serif;font-size:26px;line-height:1.5;text-align:center;color:var(--text);margin-bottom:6px;}
.frase-autore{text-align:center;font-size:14px;color:var(--text-l);font-style:italic;margin-bottom:22px;}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--terra);color:var(--terra);font-weight:700;padding:0 4px;vertical-align:bottom;}
.frase-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.frase-opt{padding:16px 12px;border:2px solid var(--warm);border-radius:14px;background:white;font-family:'DM Sans',sans-serif;font-size:18px;font-weight:600;color:var(--text);cursor:pointer;transition:all .18s;text-align:center;}
.frase-opt.correct{background:#EDF7F0;border-color:#4CAF50;color:#1B5E20;}
.frase-opt.wrong{background:#FDE8E4;border-color:#E57373;color:#7F0000;}
.frase-opt.reveal{background:#EDF7F0;border-color:#4CAF50;opacity:.6;}
.frase-opt.disabled{cursor:not-allowed;}
.frase-counter{text-align:center;font-size:14px;color:var(--text-l);font-weight:600;margin-bottom:16px;}

/* ── SCORE FINALE ── */
.result-emoji{font-size:80px;display:block;text-align:center;margin-bottom:12px;animation:popIn .4s ease both;}
.result-title{font-family:'Cormorant Garamond',serif;font-size:32px;text-align:center;color:var(--terra);margin-bottom:6px;}
.result-sub{text-align:center;font-size:17px;color:var(--text-m);margin-bottom:24px;line-height:1.5;}
.result-score{text-align:center;font-size:54px;font-weight:800;color:var(--gold);display:block;font-family:'Cormorant Garamond',serif;}
.result-label{text-align:center;font-size:15px;color:var(--text-l);margin-bottom:24px;}
.btn-row{display:flex;flex-direction:column;gap:10px;}
.btn-outline{width:100%;padding:16px;background:transparent;border:2px solid var(--terra-l);border-radius:16px;font-family:'DM Sans',sans-serif;font-size:17px;font-weight:700;color:var(--terra);cursor:pointer;transition:all .2s;}

/* ── STORICO ── */
.storico-header{margin-bottom:18px;}
.streak-big{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#FFF8E1,#FFF3CD);border:1.5px solid #FFE082;border-radius:18px;padding:18px 20px;margin-bottom:14px;}
.streak-fire{font-size:48px;}
.streak-info .val{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:700;color:#E65100;}
.streak-info .lbl{font-size:14px;color:#BF360C;font-weight:600;}
.chart-wrap{margin-top:6px;}
.chart-title{font-size:14px;font-weight:700;color:var(--text-l);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;}
.chart{display:flex;align-items:flex-end;gap:8px;height:90px;}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;}
.bar-col{width:100%;border-radius:8px 8px 0 0;transition:height .5s ease;min-height:4px;}
.bar-col.has-data{background:linear-gradient(180deg,var(--terra-l),var(--terra));}
.bar-col.today{background:linear-gradient(180deg,var(--gold-l),var(--gold));box-shadow:0 0 10px rgba(201,148,58,.4);}
.bar-col.empty{background:var(--warm);}
.bar-day{font-size:11px;color:var(--text-l);font-weight:600;}
.bar-val{font-size:12px;font-weight:700;color:var(--terra);}
.games-list{margin-top:14px;}
.game-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--warm);border-radius:14px;margin-bottom:8px;}
.game-row-left{display:flex;align-items:center;gap:12px;}
.game-row-icon{font-size:28px;}
.game-row-name{font-weight:700;font-size:16px;color:var(--text);}
.game-row-date{font-size:12px;color:var(--text-l);}
.game-row-score{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--gold);}
.no-data{text-align:center;padding:32px 20px;color:var(--text-l);font-size:16px;line-height:1.6;}

/* ── MUSICA ── */
.song-row{display:flex;align-items:center;gap:14px;padding:16px;background:white;border-radius:18px;box-shadow:0 4px 18px var(--shadow);margin-bottom:10px;border:1px solid rgba(181,96,58,.07);animation:fadeUp .3s ease both;}
.song-em{font-size:34px;min-width:46px;text-align:center;}
.song-inf{flex:1;}
.song-t{font-weight:700;font-size:17px;color:var(--text);}
.song-a{font-size:13px;color:var(--text-l);margin-top:2px;}
.song-y{font-size:12px;background:var(--warm);color:var(--text-m);padding:2px 9px;border-radius:8px;font-weight:700;white-space:nowrap;}
.play-a{display:flex;align-items:center;justify-content:center;background:var(--terra);color:white;border-radius:50%;width:44px;height:44px;font-size:16px;text-decoration:none;box-shadow:0 3px 10px rgba(181,96,58,.35);flex-shrink:0;transition:transform .15s;}
.play-a:active{transform:scale(.93);}
.music-note{text-align:center;padding:18px;font-size:15px;color:var(--text-l);line-height:1.7;}

/* ── ANIMATIONS ── */
@keyframes fadeDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes confetti{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(80px) rotate(360deg)}}
</style>
</head>

// STORAGE

const STORAGE_KEY = 'memoria-storico-v2';

async function loadStorico() {
  try {
    const r = await window.storage.get(STORAGE_KEY);
    return r ? JSON.parse(r.value) : [];
  } catch(e) { return []; }
}

async function saveRisultato(tipo, punteggio, totale) {
  try {
    const storico = await loadStorico();
    storico.push({tipo, punteggio, totale, data: getTodayKey(), ts: Date.now()});
    // Mantieni solo ultimi 100
    const trimmed = storico.slice(-100);
    await window.storage.set(STORAGE_KEY, JSON.stringify(trimmed));
  } catch(e) {}
}

function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════

function seededShuffle(arr, seed) {
  const a = [...arr];
  let h = seed;
  for (let i = a.length-1; i>0; i--) {
    h = (h*1664525+1013904223)&0xffffffff;
    const j = Math.abs(h) % (i+1);
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function getDailySeed() {
  const d = new Date();
  return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
}

function getDailyItems(pool, n, saltOffset=0) {
  return seededShuffle(pool, getDailySeed()+saltOffset).slice(0,n);
}

function getDataItaliana() {
  const g=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
  const m=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  const d=new Date();
  return `${g[d.getDay()]} ${d.getDate()} ${m[d.getMonth()]}`;
}

  const pairs=getDailyItems(MEMORIA_PAIRS,6,100);
  const flat=pairs.flatMap(p=>p);
  S.mCards=seededShuffle(flat.map((em,i)=>({em,id:i,pair:Math.floor(i/2)})),getDailySeed()+200);
  S.mFlipped=[];S.mMatched=[];S.mTentativi=0;S.mLocked=false;S.mFinito=false;
}
function initFrasi(){
  S.fFrasi=getDailyItems(FRASI_POOL,4,300);
  S.fIdx=0;S.fRisposta=false;S.fScelta=null;S.fPunteggio=0;S.fFinito=false;
}

// ═══════════════════════════════════════════════════════════
// RENDER ENGINE
// ═══════════════════════════════════════════════════════════

async function render(){
  const app=document.getElementById('app');
  app.innerHTML='';

  // Storico per streak
  S.storico = await loadStorico();
  const streak = calcStreak(S.storico);

  // Header
  const h=document.createElement('div');
  h.className='header';
  h.innerHTML=`
    <div class="header-top">
      <span class="petal">🌸</span>
      <h1>Il Gioco della Memoria</h1>
      <span class="petal">🌸</span>
    </div>
    <div>
      <span class="date-tag">📅 ${getDataItaliana()}</span>
      ${streak>0?`<span class="streak-tag">🔥 ${streak} giorni</span>`:''}
    </div>`;
  app.appendChild(h);

  // Nav
  const nav=document.createElement('div');
  nav.className='nav';
  [['quiz','🧩','Quiz'],['memoria','🃏','Memoria'],['frasi','📜','Frasi'],['storico','📊','Storico']].forEach(([id,icon,label])=>{
    const btn=document.createElement('button');
    btn.className='nav-btn'+(S.tab===id?' active':'');
    btn.innerHTML=`<span class="nav-icon">${icon}</span>${label}`;
    btn.onclick=()=>{S.tab=id;render();};
    nav.appendChild(btn);
  });
  app.appendChild(nav);

  if(S.tab==='quiz') renderQuiz(app);
  else if(S.tab==='memoria') renderMemoria(app);
  else if(S.tab==='frasi') renderFrasi(app);
  else if(S.tab==='storico') renderStorico(app);
}

// ── QUIZ ──────────────────────────────────────────────────

function renderQuiz(app){
  if(S.qFinito){renderRisultato(app,'quiz',S.qPunteggio,S.qDomande.length);return;}
  const q=S.qDomande[S.qIdx];
  const card=document.createElement('div');card.className='card';

  // Progress
  const prog=document.createElement('div');prog.className='quiz-progress';
  const bar=document.createElement('div');bar.className='quiz-progress-bar';
  bar.style.width=`${((S.qIdx+1)/S.qDomande.length)*100}%`;
  prog.appendChild(bar);card.appendChild(prog);

  card.innerHTML+=`
    <div style="text-align:center;font-size:13px;font-weight:600;color:var(--text-l);margin-bottom:14px">
      Domanda ${S.qIdx+1} di ${S.qDomande.length}
    </div>
    <span class="quiz-icon">${q.icon}</span>
    <div class="quiz-q">${q.q}</div>`;

  const opts=document.createElement('div');opts.className='opts';
  q.r.forEach((r,i)=>{
    const btn=document.createElement('button');btn.className='opt';
    btn.textContent=r;
    if(S.qRisposta){
      if(i===q.c) btn.classList.add('correct');
      else if(i===S.qScelta) btn.classList.add('wrong');
      else btn.classList.add('reveal');
      btn.classList.add('disabled');
    }
    btn.onclick=()=>{
      if(S.qRisposta)return;
      S.qRisposta=true;S.qScelta=i;
      if(i===q.c)S.qPunteggio++;
      render();
    };
    opts.appendChild(btn);
  });
  card.appendChild(opts);

  if(S.qRisposta){
    const ok=S.qScelta===q.c;
    const fb=document.createElement('div');
    fb.className='feedback-bar '+(ok?'ok':'ko');
    fb.textContent=ok?rand(BRAVO):rand(QUASI);
    card.appendChild(fb);
    const nb=document.createElement('button');
    nb.className='btn-next'+(ok?' sage':'');
    const isLast=S.qIdx===S.qDomande.length-1;
    nb.textContent=isLast?'🏁 Vedi il risultato':'➡️ Prossima domanda';
    nb.onclick=()=>{
      if(isLast){S.qFinito=true;saveRisultato('Quiz',S.qPunteggio,S.qDomande.length);}
      else{S.qIdx++;S.qRisposta=false;S.qScelta=null;}
      render();
    };
    card.appendChild(nb);
  }
  app.appendChild(card);
}

// ── MEMORIA ───────────────────────────────────────────────

function renderMemoria(app){
  if(S.mFinito){renderRisultato(app,'memoria',S.mCards.length/2,S.mCards.length/2,`in ${S.mTentativi} tentativi`);return;}

  const card=document.createElement('div');card.className='card';
  card.innerHTML=`
    <div class="card-title">🃏 Abbina le coppie</div>
    <div class="card-sub">Trova tutte le coppie uguali!</div>`;

  const info=document.createElement('div');info.className='mem-info';
  const paired=S.mMatched.length/2;
  info.innerHTML=`
    <div class="mem-stat"><div class="val">${paired}</div><div class="lbl">Coppie trovate</div></div>
    <div class="mem-stat"><div class="val">${S.mCards.length/2-paired}</div><div class="lbl">Rimaste</div></div>
    <div class="mem-stat"><div class="val">${S.mTentativi}</div><div class="lbl">Tentativi</div></div>`;
  card.appendChild(info);

  const grid=document.createElement('div');grid.className='mem-grid';
  S.mCards.forEach((c,i)=>{
    const mc=document.createElement('div');
    mc.className='mem-card';
    mc.id='mc'+i;
    const isFlipped=S.mFlipped.includes(i);
    const isMatched=S.mMatched.includes(i);
    if(isFlipped||isMatched)mc.classList.add('flipped');
    if(isMatched)mc.classList.add('matched');
    mc.innerHTML=`<span class="mem-back">🌸</span><span class="mem-front">${c.em}</span>`;
    if(!isMatched){
      mc.onclick=()=>flipCard(i);
    }
    grid.appendChild(mc);
  });
  card.appendChild(grid);
  app.appendChild(card);
}

function flipCard(i){
  if(S.mLocked)return;
  if(S.mFlipped.includes(i)||S.mMatched.includes(i))return;
  if(S.mFlipped.length>=2)return;
  S.mFlipped.push(i);
  const el=document.getElementById('mc'+i);
  if(el){el.classList.add('flipped');}
  if(S.mFlipped.length===2){
    S.mTentativi++;
    S.mLocked=true;
    const [a,b]=S.mFlipped;
    setTimeout(()=>{
      if(S.mCards[a].em===S.mCards[b].em){
        S.mMatched.push(a,b);
        S.mFlipped=[];S.mLocked=false;
        if(S.mMatched.length===S.mCards.length){
          S.mFinito=true;
          saveRisultato('Memoria',S.mCards.length/2,S.mCards.length/2);
        }
        render();
      } else {
        const ea=document.getElementById('mc'+a);
        const eb=document.getElementById('mc'+b);
        if(ea)ea.classList.add('shake');
        if(eb)eb.classList.add('shake');
        setTimeout(()=>{
          S.mFlipped=[];S.mLocked=false;
          [ea,eb].forEach(el=>{if(el){el.classList.remove('flipped','shake');}});
        },600);
      }
    },700);
  }
}

// ── FRASI ─────────────────────────────────────────────────

function renderFrasi(app){
  if(S.fFinito){renderRisultato(app,'frasi',S.fPunteggio,S.fFrasi.length);return;}
  const f=S.fFrasi[S.fIdx];
  const card=document.createElement('div');card.className='card';

  const prog=document.createElement('div');prog.className='quiz-progress';
  const bar=document.createElement('div');bar.className='quiz-progress-bar';
  bar.style.width=`${((S.fIdx+1)/S.fFrasi.length)*100}%`;
  prog.appendChild(bar);card.appendChild(prog);

  const cnt=document.createElement('div');cnt.className='frase-counter';
  cnt.textContent=`Frase ${S.fIdx+1} di ${S.fFrasi.length}`;
  card.appendChild(cnt);

  // Testo con blank
  const parola=S.fRisposta?f.parola:'_____';
  const testoHtml=f.testo.replace('_____',`<span class="blank">${parola}</span>`);
  const frase=document.createElement('div');frase.className='frase-container';
  frase.innerHTML=`
    <div class="frase-text">"${testoHtml}"</div>
    <div class="frase-autore">— ${f.autore}</div>`;
  card.appendChild(frase);

  const opts=document.createElement('div');opts.className='frase-opts';
  f.opz.forEach((o,i)=>{
    const btn=document.createElement('button');btn.className='frase-opt';
    btn.textContent=o;
    if(S.fRisposta){
      if(i===f.c)btn.classList.add('correct');
      else if(i===S.fScelta)btn.classList.add('wrong');
      else btn.classList.add('reveal');
      btn.classList.add('disabled');
    }
    btn.onclick=()=>{
      if(S.fRisposta)return;
      S.fRisposta=true;S.fScelta=i;
      if(i===f.c)S.fPunteggio++;
      render();
    };
    opts.appendChild(btn);
  });
  card.appendChild(opts);

  if(S.fRisposta){
    const ok=S.fScelta===f.c;
    const fb=document.createElement('div');fb.className='feedback-bar '+(ok?'ok':'ko');
    fb.textContent=ok?rand(BRAVO):rand(QUASI);
    card.appendChild(fb);
    const nb=document.createElement('button');nb.className='btn-next'+(ok?' sage':'');
    const isLast=S.fIdx===S.fFrasi.length-1;
    nb.textContent=isLast?'🏁 Vedi il risultato':'➡️ Prossima frase';
    nb.onclick=()=>{
      if(isLast){S.fFinito=true;saveRisultato('Frasi',S.fPunteggio,S.fFrasi.length);}
      else{S.fIdx++;S.fRisposta=false;S.fScelta=null;}
      render();
    };
    card.appendChild(nb);
  }
  app.appendChild(card);
}

// ── RISULTATO ─────────────────────────────────────────────

function renderRisultato(app, tipo, p, tot, extra=''){
  const perc=Math.round((p/tot)*100);
  let em,titolo,testo;
  if(perc===100){em='🏆';titolo='Perfetto!';testo='Tutte le risposte giuste. Sei straordinaria!';}
  else if(perc>=60){em='⭐';titolo='Molto bene!';testo='Ottimo risultato oggi. Sei fantastica!';}
  else{em='💛';titolo='Bravo tentativo!';testo='Ogni giorno si migliora. Sei bravissima lo stesso!';}

  const card=document.createElement('div');card.className='card';
  card.style.textAlign='center';card.style.padding='32px 20px';
  card.innerHTML=`
    <span class="result-emoji">${em}</span>
    <div class="result-title">${titolo}</div>
    <div class="result-sub">${testo}${extra?'<br><small style="color:var(--text-l)">'+extra+'</small>':''}</div>
    <span class="result-score">${p} / ${tot}</span>
    <div class="result-label">risposte corrette</div>`;

  const btns=document.createElement('div');btns.className='btn-row';

  const btnMusica=document.createElement('button');btnMusica.className='btn-next';
  btnMusica.textContent='🎵 Vai alla musica';
  btnMusica.onclick=()=>{S.tab='musica';render();};

  const btnRigioca=document.createElement('button');btnRigioca.className='btn-outline';
  btnRigioca.textContent='🔄 Rigioca';
  btnRigioca.onclick=()=>{
    if(tipo==='quiz')initQuiz();
    else if(tipo==='memoria')initMemoria();
    else if(tipo==='frasi')initFrasi();
    render();
  };

  const btnStorico=document.createElement('button');btnStorico.className='btn-outline';
  btnStorico.textContent='📊 Vedi i tuoi progressi';
  btnStorico.onclick=()=>{S.tab='storico';render();};

  btns.appendChild(btnMusica);btns.appendChild(btnRigioca);btns.appendChild(btnStorico);
  card.appendChild(btns);
  app.appendChild(card);
}

// ── STORICO ───────────────────────────────────────────────

function calcStreak(storico){
  if(!storico.length)return 0;
  const byDay=new Set(storico.map(s=>s.data));
  const days=[...byDay].sort().reverse();
  const today=getTodayKey();
  if(!byDay.has(today))return 0;
  let streak=1;
  let d=new Date();
  for(let i=1;i<60;i++){
    d.setDate(d.getDate()-1);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(byDay.has(key))streak++;
    else break;
  }
  return streak;
}

function renderStorico(app){
  const storico=S.storico;
  const streak=calcStreak(storico);

  const header=document.createElement('div');header.className='card';
  // Streak
  header.innerHTML=`<div class="card-title">📊 I tuoi progressi</div><div class="card-sub">Continua così ogni giorno!</div>`;

  const streakEl=document.createElement('div');streakEl.className='streak-big';
  streakEl.innerHTML=`
    <span class="streak-fire">🔥</span>
    <div class="streak-info">
      <div class="val">${streak} ${streak===1?'giorno':'giorni'}</div>
      <div class="lbl">Striscia attuale</div>
    </div>`;
  header.appendChild(streakEl);

  // Chart ultimi 7 giorni
  const chartWrap=document.createElement('div');chartWrap.className='chart-wrap';
  chartWrap.innerHTML='<div class="chart-title">Punteggi ultimi 7 giorni</div>';
  const chart=document.createElement('div');chart.className='chart';

  const today=getTodayKey();
  const d=new Date();
  for(let i=6;i>=0;i--){
    const dd=new Date(d);dd.setDate(d.getDate()-i);
    const key=`${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}-${String(dd.getDate()).padStart(2,'0')}`;
    const giornoLabel=['Do','Lu','Ma','Me','Gi','Ve','Sa'][dd.getDay()];
    const giorniRisultati=storico.filter(s=>s.data===key);
    const avgPerc=giorniRisultati.length
      ? Math.round(giorniRisultati.reduce((a,s)=>a+(s.punteggio/s.totale)*100,0)/giorniRisultati.length)
      : 0;
    const wrap=document.createElement('div');wrap.className='bar-wrap';
    const col=document.createElement('div');
    col.className='bar-col '+(avgPerc>0?(key===today?'today':'has-data'):'empty');
    col.style.height=`${Math.max(avgPerc,4)}%`;
    const dayL=document.createElement('div');dayL.className='bar-day';dayL.textContent=giornoLabel;
    const valL=document.createElement('div');valL.className='bar-val';valL.textContent=avgPerc>0?avgPerc+'%':'';
    wrap.appendChild(valL);wrap.appendChild(col);wrap.appendChild(dayL);
    chart.appendChild(wrap);
  }
  chartWrap.appendChild(chart);
  header.appendChild(chartWrap);
  app.appendChild(header);

  // Lista ultimi giochi
  if(storico.length>0){
    const listCard=document.createElement('div');listCard.className='card';
    listCard.innerHTML='<div class="card-title" style="margin-bottom:14px">Ultime partite</div>';
    const list=document.createElement('div');list.className='games-list';
    const icons={'Quiz':'🧩','Memoria':'🃏','Frasi':'📜'};
    const recent=[...storico].reverse().slice(0,8);
    recent.forEach(s=>{
      const perc=Math.round((s.punteggio/s.totale)*100);
      const row=document.createElement('div');row.className='game-row';
      row.innerHTML=`
        <div class="game-row-left">
          <span class="game-row-icon">${icons[s.tipo]||'🎮'}</span>
          <div>
            <div class="game-row-name">${s.tipo}</div>
            <div class="game-row-date">${s.data}</div>
          </div>
        </div>
        <span class="game-row-score">${perc}%</span>`;
      list.appendChild(row);
    });
    listCard.appendChild(list);
    app.appendChild(listCard);
  } else {
    const empty=document.createElement('div');empty.className='card';
    empty.innerHTML='<div class="no-data">🌸 Nessuna partita ancora.<br>Inizia a giocare per vedere i tuoi progressi!</div>';
    app.appendChild(empty);
  }
}

// ── MUSICA ────────────────────────────────────────────────

// Aggiungi tab musica al nav — la gestiamo qui
function renderMusica(app){
  const header=document.createElement('div');header.className='card';
  header.innerHTML=`
    <div class="card-title">🎵 Musica del cuore</div>
    <div class="card-sub">Tocca ▶ per ascoltare su YouTube</div>`;
  app.appendChild(header);

  getDailyItems(CANZONI,5,400).forEach((s,i)=>{
    const row=document.createElement('div');row.className='song-row';
    row.style.animationDelay=`${i*0.07}s`;
    row.innerHTML=`
      <div class="song-em">${s.e}</div>
      <div class="song-inf">
        <div class="song-t">${s.t}</div>
        <div class="song-a">${s.a}</div>
      </div>
      <span class="song-y">${s.y}</span>
      <a href="${s.url}" target="_blank" class="play-a">▶</a>`;
    app.appendChild(row);
  });

  const nota=document.createElement('div');nota.className='music-note';
  nota.innerHTML='💛 La musica fa bene al cuore e alla memoria.<br>Buon ascolto!';
  app.appendChild(nota);
}

// Patch nav per aggiungere musica
const _origRender=render;
window._renderMusica=renderMusica;

// Override render to support musica tab
const renderWithMusica=async()=>{
  const app=document.getElementById('app');
  app.innerHTML='';
  S.storico=await loadStorico();
  const streak=calcStreak(S.storico);

  const h=document.createElement('div');h.className='header';
  h.innerHTML=`
    <div class="header-top">
      <span class="petal">🌸</span>
      <h1>Il Gioco della Memoria</h1>
      <span class="petal">🌸</span>
    </div>
    <div>
      <span class="date-tag">📅 ${getDataItaliana()}</span>
      ${streak>0?`<span class="streak-tag">🔥 ${streak} giorni</span>`:''}
    </div>`;
  app.appendChild(h);

  const nav=document.createElement('div');nav.className='nav';
  [['quiz','🧩','Quiz'],['memoria','🃏','Memoria'],['frasi','📜','Frasi'],['storico','📊','Storico'],['musica','🎵','Musica']].forEach(([id,icon,label])=>{
    const btn=document.createElement('button');
    btn.className='nav-btn'+(S.tab===id?' active':'');
    btn.innerHTML=`<span class="nav-icon">${icon}</span>${label}`;
    btn.onclick=()=>{S.tab=id;renderWithMusica();};
    nav.appendChild(btn);
  });
  nav.style.gridTemplateColumns='repeat(5,1fr)';
  app.appendChild(nav);

  if(S.tab==='quiz')renderQuiz(app);
  else if(S.tab==='memoria')renderMemoria(app);
  else if(S.tab==='frasi')renderFrasi(app);
  else if(S.tab==='storico')renderStorico(app);
  else if(S.tab==='musica')renderMusica(app);
};

// Patch all navigation calls
window.render=renderWithMusica;

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
initQuiz();initMemoria();initFrasi();
renderWithMusica();
</script>
