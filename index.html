<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Il Gioco della Memoria 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --cream:#FAF6F0; --warm:#F2E8D9; --warmer:#E8D5BB;
  --terra:#B5603A; --terra-l:#D4845C; --terra-d:#8A4428;
  --sage:#7A9E82; --sage-l:#A5C4AC;
  --gold:#C9943A; --gold-l:#E8BF6A;
  --sky:#5B8DB8; --sky-l:#85B4D8;
  --plum:#8B5E8B; --plum-l:#B48AB4;
  --text:#2C1A0E; --text-m:#6B4C35; --text-l:#A07858;
  --shadow:rgba(44,26,14,0.10); --shadow-d:rgba(44,26,14,0.18);
  --r:22px;
}
html{background:var(--cream);}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 80% 10%,#F2E8D966,transparent 70%),radial-gradient(ellipse 50% 60% at 10% 90%,#E8F2EA55,transparent 70%);pointer-events:none;z-index:0;}

.app{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:0 16px 60px;}

/* ══ SPLASH ══════════════════════════════════════════════════ */
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;animation:fadeIn .6s ease both;}
.splash-flower{font-size:52px;display:block;margin-bottom:20px;animation:floatIn .8s cubic-bezier(.34,1.56,.64,1) both;}
.splash-buongiorno{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--text-l);margin-bottom:6px;animation:fadeUp .5s .15s ease both;}
.splash-data{font-size:15px;font-weight:700;color:var(--terra);background:var(--warm);padding:5px 18px;border-radius:20px;display:inline-block;margin-bottom:32px;animation:fadeUp .5s .2s ease both;}
.splash-quote-card{background:white;border-radius:24px;padding:28px 24px;box-shadow:0 12px 40px var(--shadow-d);width:100%;margin-bottom:28px;border:1.5px solid rgba(201,148,58,.15);animation:fadeUp .5s .3s ease both;}
.splash-quote-icon{font-size:40px;margin-bottom:14px;display:block;}
.splash-virgola{font-family:'Cormorant Garamond',serif;font-size:52px;color:var(--gold-l);line-height:.6;display:block;margin-bottom:8px;}
.splash-frase{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;line-height:1.5;color:var(--text);margin-bottom:12px;}
.splash-autore{font-size:14px;color:var(--text-l);font-style:italic;}
.splash-divider{width:40px;height:3px;background:linear-gradient(90deg,var(--gold),var(--terra-l));border-radius:2px;margin:14px auto;}
.splash-bar-wrap{width:100%;height:5px;background:var(--warm);border-radius:10px;overflow:hidden;margin-bottom:10px;animation:fadeUp .5s .5s ease both;}
.splash-bar{height:100%;background:linear-gradient(90deg,var(--terra),var(--terra-l));border-radius:10px;width:0;transition:width linear;}
.splash-hint{font-size:14px;color:var(--text-l);animation:fadeUp .5s .6s ease both;margin-bottom:8px;}
.splash-btn{background:var(--terra);color:white;border:none;border-radius:18px;padding:18px 36px;font-family:'DM Sans',sans-serif;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(181,96,58,.35);animation:fadeUp .5s .7s ease both;transition:transform .15s;}
.splash-btn:active{transform:scale(.97);}

/* ══ HEADER ══════════════════════════════════════════════════ */
.header{padding:24px 0 8px;text-align:center;animation:fadeDown .5s ease both;}
.header-top{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px;}
.header h1{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;color:var(--terra);}
.header .petal{font-size:24px;}
.date-tag{display:inline-block;background:var(--warm);border:1.5px solid var(--warmer);border-radius:30px;padding:4px 14px;font-size:13px;font-weight:600;color:var(--text-m);}
.streak-tag{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#FFF3E0,#FFE0B2);border:1.5px solid #FFCC80;border-radius:30px;padding:4px 12px;font-size:13px;font-weight:700;color:#E65100;margin-left:6px;}

/* ══ NAV ═════════════════════════════════════════════════════ */
.nav{display:grid;gap:5px;margin:14px 0;background:var(--warm);padding:5px;border-radius:18px;animation:fadeUp .4s .1s ease both;}
.nav-btn{padding:10px 4px;border:none;border-radius:13px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;background:transparent;color:var(--text-l);line-height:1.3;text-align:center;}
.nav-btn .nav-icon{display:block;font-size:18px;margin-bottom:2px;}
.nav-btn.active{background:white;color:var(--terra);box-shadow:0 3px 12px var(--shadow-d);}

/* ══ CARD ════════════════════════════════════════════════════ */
.card{background:white;border-radius:var(--r);padding:22px 18px;box-shadow:0 6px 28px var(--shadow);margin-bottom:14px;border:1px solid rgba(181,96,58,.07);animation:fadeUp .35s ease both;}
.card-title{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:700;color:var(--terra);margin-bottom:4px;}
.card-sub{font-size:13px;color:var(--text-l);margin-bottom:16px;}

/* ══ QUIZ ════════════════════════════════════════════════════ */
.quiz-progress{height:5px;background:var(--warm);border-radius:10px;margin-bottom:18px;overflow:hidden;}
.quiz-progress-bar{height:100%;background:linear-gradient(90deg,var(--terra),var(--terra-l));border-radius:10px;transition:width .4s ease;}
.quiz-icon{text-align:center;font-size:72px;margin-bottom:10px;display:block;animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both;}
.quiz-q{font-family:'Cormorant Garamond',serif;font-size:26px;text-align:center;line-height:1.3;margin-bottom:22px;color:var(--text);}
.opts{display:flex;flex-direction:column;gap:9px;}
.opt{padding:17px 18px;border:2px solid var(--warm);border-radius:15px;background:white;font-family:'DM Sans',sans-serif;font-size:18px;font-weight:600;color:var(--text);cursor:pointer;transition:all .18s;text-align:left;}
.opt:active{transform:scale(.98);}
.opt.correct{background:#EDF7F0;border-color:#4CAF50;color:#1B5E20;}
.opt.wrong{background:#FDE8E4;border-color:#E57373;color:#7F0000;}
.opt.reveal{background:#EDF7F0;border-color:#81C784;color:#2E7D32;opacity:.65;}
.opt.disabled{cursor:not-allowed;}
.feedback-bar{margin-top:12px;padding:13px 16px;border-radius:13px;font-size:19px;font-weight:700;text-align:center;animation:popIn .3s ease both;}
.feedback-bar.ok{background:#EDF7F0;color:#2E7D32;}
.feedback-bar.ko{background:#FDE8E4;color:#C62828;}
.btn-next{width:100%;margin-top:10px;padding:17px;background:var(--terra);color:white;border:none;border-radius:15px;font-family:'DM Sans',sans-serif;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 5px 18px rgba(181,96,58,.35);transition:all .2s;}
.btn-next:active{transform:scale(.98);}
.btn-next.sage{background:var(--sage);box-shadow:0 5px 18px rgba(122,158,130,.35);}
.btn-next.sky{background:var(--sky);box-shadow:0 5px 18px rgba(91,141,184,.35);}

/* ══ MEMORY ══════════════════════════════════════════════════ */
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:4px;}
.mem-card{aspect-ratio:1;border-radius:13px;border:2px solid var(--warm);background:var(--warm);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:34px;transition:all .25s;position:relative;user-select:none;}
.mem-card .mem-back{font-size:22px;color:var(--text-l);position:absolute;}
.mem-card .mem-front{opacity:0;transition:opacity .2s;}
.mem-card.flipped{background:white;border-color:var(--terra-l);box-shadow:0 3px 12px var(--shadow);}
.mem-card.flipped .mem-back{opacity:0;}
.mem-card.flipped .mem-front{opacity:1;}
.mem-card.matched{background:linear-gradient(135deg,#EDF7F0,#D4EDDA);border-color:#81C784;cursor:default;}
.mem-card.matched .mem-front{opacity:1;}
.mem-card.shake{animation:shake .35s ease;}
.mem-info{display:flex;justify-content:space-around;margin-bottom:14px;}
.mem-stat .val{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;color:var(--terra);text-align:center;}
.mem-stat .lbl{font-size:11px;color:var(--text-l);font-weight:600;text-align:center;}

/* ══ FRASI ═══════════════════════════════════════════════════ */
.frase-text{font-family:'Cormorant Garamond',serif;font-size:25px;line-height:1.5;text-align:center;color:var(--text);margin-bottom:6px;}
.frase-autore{text-align:center;font-size:13px;color:var(--text-l);font-style:italic;margin-bottom:20px;}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--terra);color:var(--terra);font-weight:700;padding:0 4px;vertical-align:bottom;}
.frase-opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.frase-opt{padding:15px 10px;border:2px solid var(--warm);border-radius:14px;background:white;font-family:'DM Sans',sans-serif;font-size:17px;font-weight:600;color:var(--text);cursor:pointer;transition:all .18s;text-align:center;}
.frase-opt.correct{background:#EDF7F0;border-color:#4CAF50;color:#1B5E20;}
.frase-opt.wrong{background:#FDE8E4;border-color:#E57373;color:#7F0000;}
.frase-opt.reveal{background:#EDF7F0;border-color:#81C784;opacity:.6;}
.frase-opt.disabled{cursor:not-allowed;}

/* ══ BUON UMORE (tab) ════════════════════════════════════════ */
.umore-big{background:linear-gradient(145deg,#FFF8F0,#FFF0E0);border-radius:var(--r);padding:28px 22px;box-shadow:0 8px 32px var(--shadow);margin-bottom:14px;border:1.5px solid rgba(201,148,58,.2);text-align:center;}
.umore-icon{font-size:52px;display:block;margin-bottom:14px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both;}
.umore-frase{font-family:'Cormorant Garamond',serif;font-size:25px;font-weight:600;line-height:1.5;color:var(--text);margin-bottom:10px;}
.umore-autore{font-size:14px;color:var(--text-l);font-style:italic;margin-bottom:18px;}
.umore-div{width:40px;height:3px;background:linear-gradient(90deg,var(--gold),var(--terra-l));border-radius:2px;margin:0 auto 18px;}
.btn-altra{width:100%;padding:15px;background:transparent;border:2px solid var(--gold);border-radius:15px;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:700;color:var(--gold);cursor:pointer;transition:all .2s;}
.btn-altra:active{background:#FFF8E1;}

/* ══ NUMERI ══════════════════════════════════════════════════ */
.num-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.num-lv{background:var(--warm);border-radius:10px;padding:5px 14px;font-size:13px;font-weight:700;color:var(--terra);}
.num-tentativi{font-size:13px;color:var(--text-l);font-weight:600;}
.num-display{background:linear-gradient(135deg,#1C0E00,#3A2000);border-radius:20px;padding:30px 20px;text-align:center;margin-bottom:18px;position:relative;overflow:hidden;}
.num-display::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(201,148,58,.25),transparent 65%);}
.num-seq{font-family:'Cormorant Garamond',serif;font-size:46px;font-weight:700;color:#FFD580;letter-spacing:10px;position:relative;transition:opacity .4s,filter .4s;}
.num-seq.hidden{opacity:0;filter:blur(8px);}
.num-sub{font-size:13px;color:rgba(255,213,128,.55);margin-top:8px;font-weight:600;position:relative;}
.num-phase-label{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,213,128,.4);position:relative;margin-bottom:6px;}
.num-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
.num-key{padding:20px 10px;border:2px solid var(--warm);border-radius:16px;background:white;font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;color:var(--text);cursor:pointer;transition:all .15s;text-align:center;}
.num-key:active{background:var(--warm);transform:scale(.95);}
.num-key.del{font-size:20px;color:var(--terra);}
.num-key.ok{background:var(--terra);color:white;border-color:var(--terra);font-family:'DM Sans',sans-serif;font-size:17px;font-weight:700;box-shadow:0 4px 14px rgba(181,96,58,.35);}
.num-risposta{font-family:'Cormorant Garamond',serif;font-size:36px;letter-spacing:8px;text-align:center;padding:14px;background:var(--warm);border-radius:14px;margin-bottom:14px;min-height:64px;color:var(--text);font-weight:700;}
.num-risposta.placeholder{color:var(--text-l);font-size:18px;letter-spacing:0;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;}
.num-istruzioni{text-align:center;font-size:15px;color:var(--text-m);margin-bottom:16px;font-weight:600;}

/* ══ STORICO ═════════════════════════════════════════════════ */
.streak-big{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#FFF8E1,#FFF3CD);border:1.5px solid #FFE082;border-radius:18px;padding:16px 18px;margin-bottom:14px;}
.streak-fire{font-size:44px;}
.streak-info .val{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:700;color:#E65100;}
.streak-info .lbl{font-size:13px;color:#BF360C;font-weight:600;}
.chart{display:flex;align-items:flex-end;gap:7px;height:80px;margin-top:8px;}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.bar-col{width:100%;border-radius:7px 7px 0 0;min-height:4px;}
.bar-col.has-data{background:linear-gradient(180deg,var(--terra-l),var(--terra));}
.bar-col.today{background:linear-gradient(180deg,var(--gold-l),var(--gold));box-shadow:0 0 10px rgba(201,148,58,.4);}
.bar-col.empty{background:var(--warm);}
.bar-day{font-size:10px;color:var(--text-l);font-weight:600;}
.bar-val{font-size:11px;font-weight:700;color:var(--terra);}
.game-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--warm);border-radius:13px;margin-bottom:8px;}
.game-row-left{display:flex;align-items:center;gap:10px;}
.game-row-icon{font-size:26px;}
.game-row-name{font-weight:700;font-size:15px;color:var(--text);}
.game-row-date{font-size:11px;color:var(--text-l);}
.game-row-score{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--gold);}
.no-data{text-align:center;padding:28px 16px;color:var(--text-l);font-size:15px;line-height:1.6;}

/* ══ MUSICA ══════════════════════════════════════════════════ */
.song-row{display:flex;align-items:center;gap:12px;padding:14px;background:white;border-radius:16px;box-shadow:0 4px 18px var(--shadow);margin-bottom:10px;border:1px solid rgba(181,96,58,.07);animation:fadeUp .3s ease both;}
.song-em{font-size:32px;min-width:44px;text-align:center;}
.song-inf{flex:1;}
.song-t{font-weight:700;font-size:16px;color:var(--text);}
.song-a{font-size:12px;color:var(--text-l);margin-top:2px;}
.song-y{font-size:11px;background:var(--warm);color:var(--text-m);padding:2px 8px;border-radius:7px;font-weight:700;white-space:nowrap;}
.play-a{display:flex;align-items:center;justify-content:center;background:var(--terra);color:white;border-radius:50%;width:42px;height:42px;font-size:15px;text-decoration:none;box-shadow:0 3px 10px rgba(181,96,58,.35);flex-shrink:0;transition:transform .15s;}
.play-a:active{transform:scale(.93);}

/* ══ RISULTATO ═══════════════════════════════════════════════ */
.result-emoji{font-size:76px;display:block;text-align:center;margin-bottom:10px;animation:popIn .4s ease both;}
.result-title{font-family:'Cormorant Garamond',serif;font-size:30px;text-align:center;color:var(--terra);margin-bottom:6px;}
.result-sub{text-align:center;font-size:16px;color:var(--text-m);margin-bottom:22px;line-height:1.5;}
.result-score{text-align:center;font-size:52px;font-weight:800;color:var(--gold);display:block;font-family:'Cormorant Garamond',serif;}
.result-label{text-align:center;font-size:14px;color:var(--text-l);margin-bottom:22px;}
.btn-outline{width:100%;padding:15px;background:transparent;border:2px solid var(--terra-l);border-radius:15px;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:700;color:var(--terra);cursor:pointer;transition:all .2s;margin-top:8px;}

/* ══ ANIMATIONS ══════════════════════════════════════════════ */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes floatIn{from{opacity:0;transform:scale(.5) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// ══════════════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════════════

  {icon:'☁️',q:'Di che colore sono le nuvole quando sta per piovere?',r:['Bianche','Grigie','Rosa'],c:1},

const STORAGE_KEY='memoria-storico-v3';
async function loadStorico(){try{const r=await window.storage.get(STORAGE_KEY);return r?JSON.parse(r.value):[]}catch(e){return[]}}
async function saveRisultato(tipo,punteggio,totale){
  try{
    const s=await loadStorico();
    s.push({tipo,punteggio,totale,data:getTodayKey(),ts:Date.now()});
    await window.storage.set(STORAGE_KEY,JSON.stringify(s.slice(-150)));
  }catch(e){}
}
function getTodayKey(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

// HELPERS
// ══════════════════════════════════════════════════════════════
function seededShuffle(arr,seed){
  const a=[...arr];let h=seed;
  for(let i=a.length-1;i>0;i--){h=(h*1664525+1013904223)&0xffffffff;const j=Math.abs(h)%(i+1);[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function getDailySeed(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function getDailyItems(pool,n,salt=0){return seededShuffle(pool,getDailySeed()+salt).slice(0,n);}
function getDataItaliana(){
  const g=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
  const m=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  const d=new Date();return`${g[d.getDay()]} ${d.getDate()} ${m[d.getMonth()]}`;
}
function rand(arr){return arr[Math.floor(Math.random()*arr.length)];}

  if(S.nTimer)clearInterval(S.nTimer);
  const n=lv+2; // livello 1=3 cifre, lv 2=4 cifre, ecc.
  S.nSequenza=Array.from({length:n},()=>Math.floor(Math.random()*9)+1);
  S.nLivello=lv;S.nFase='guarda';S.nInput='';S.nFinito=false;S.nRisultato=null;

let splashTimer=null;
function renderSplash(app){
  const frase=getDailyItems(FRASI_BUONUMORE,1,999)[0];
  const DURATA=8; // secondi

  const splash=document.createElement('div');splash.className='splash';
  splash.innerHTML=`
    <span class="splash-flower">🌸</span>
    <div class="splash-buongiorno">Buongiorno!</div>
    <div class="splash-data">📅 ${getDataItaliana()}</div>
    <div class="splash-quote-card">
      <span class="splash-quote-icon">${frase.icon}</span>
      <div class="splash-virgola">"</div>
      <div class="splash-frase">${frase.frase}</div>
      <div class="splash-divider"></div>
      <div class="splash-autore">— ${frase.autore}</div>
    </div>
    <div class="splash-bar-wrap"><div class="splash-bar" id="splash-bar"></div></div>
    <div class="splash-hint">Tocca per iniziare subito ✨</div>
    <button class="splash-btn" id="splash-btn">🧩 Iniziamo a giocare!</button>`;

  app.appendChild(splash);

  // Barra progresso automatica
  const bar=document.getElementById('splash-bar');
  let elapsed=0;
  const STEP=100;
  splashTimer=setInterval(()=>{
    elapsed+=STEP;
    const perc=Math.min((elapsed/(DURATA*1000))*100,100);
    bar.style.width=perc+'%';
    if(elapsed>=DURATA*1000){clearInterval(splashTimer);goToGiochi();}
  },STEP);

  const goToGiochi=()=>{
    if(splashTimer)clearInterval(splashTimer);
    S.schermata='giochi';
    renderApp();
  };
  document.getElementById('splash-btn').onclick=goToGiochi;
  splash.onclick=(e)=>{if(e.target.id!=='splash-btn')goToGiochi();};
}

// ══════════════════════════════════════════════════════════════
// GIOCHI — header + nav + contenuto
// ══════════════════════════════════════════════════════════════
function renderGiochi(app){
  const streak=calcStreak(S.storico);

  // Header
  const h=document.createElement('div');h.className='header';
  h.innerHTML=`
    <div class="header-top"><span class="petal">🌸</span><h1>Il Gioco della Memoria</h1><span class="petal">🌸</span></div>
    <div>
      <span class="date-tag">📅 ${getDataItaliana()}</span>
      ${streak>0?`<span class="streak-tag">🔥 ${streak} giorni</span>`:''}
    </div>`;
  app.appendChild(h);

  // Nav (7 tab → griglia 7 colonne)
  const tabs=[['quiz','🧩','Quiz'],['memoria','🃏','Coppie'],['frasi','📜','Frasi'],['numeri','🔢','Numeri'],['umore','😊','Umore'],['storico','📊','Score'],['musica','🎵','Musica']];
  const nav=document.createElement('div');nav.className='nav';
  nav.style.gridTemplateColumns=`repeat(${tabs.length},1fr)`;
  tabs.forEach(([id,icon,label])=>{
    const btn=document.createElement('button');btn.className='nav-btn'+(S.tab===id?' active':'');
    btn.innerHTML=`<span class="nav-icon">${icon}</span>${label}`;
    btn.onclick=()=>{S.tab=id;renderApp();};
    nav.appendChild(btn);
  });
  app.appendChild(nav);

  // Contenuto
  if(S.tab==='quiz')renderQuiz(app);
  else if(S.tab==='memoria')renderMemoria(app);
  else if(S.tab==='frasi')renderFrasi(app);
  else if(S.tab==='numeri')renderNumeri(app);
  else if(S.tab==='umore')renderUmore(app);
  else if(S.tab==='storico')renderStorico(app);
  else if(S.tab==='musica')renderMusica(app);
}

// QUIZ
// ══════════════════════════════════════════════════════════════
function renderQuiz(app){
  if(S.qFinito){renderRisultato(app,'quiz','Quiz',S.qPunteggio,S.qDomande.length);return;}
  const q=S.qDomande[S.qIdx];
  const card=document.createElement('div');card.className='card';
  const prog=document.createElement('div');prog.className='quiz-progress';
  const bar=document.createElement('div');bar.className='quiz-progress-bar';
  bar.style.width=`${((S.qIdx+1)/S.qDomande.length)*100}%`;
  prog.appendChild(bar);card.appendChild(prog);
  card.innerHTML+=`<div style="text-align:center;font-size:12px;font-weight:600;color:var(--text-l);margin-bottom:12px">Domanda ${S.qIdx+1} di ${S.qDomande.length}</div><span class="quiz-icon">${q.icon}</span><div class="quiz-q">${q.q}</div>`;
  const opts=document.createElement('div');opts.className='opts';
  q.r.forEach((r,i)=>{
    const btn=document.createElement('button');btn.className='opt';btn.textContent=r;
    if(S.qRisposta){
      if(i===q.c)btn.classList.add('correct');
      else if(i===S.qScelta)btn.classList.add('wrong');
      else btn.classList.add('reveal');
      btn.classList.add('disabled');
    }
    btn.onclick=()=>{if(S.qRisposta)return;S.qRisposta=true;S.qScelta=i;if(i===q.c)S.qPunteggio++;renderApp();};
    opts.appendChild(btn);
  });
  card.appendChild(opts);
  if(S.qRisposta){
    const ok=S.qScelta===q.c;
    const fb=document.createElement('div');fb.className='feedback-bar '+(ok?'ok':'ko');fb.textContent=ok?rand(BRAVO):rand(QUASI);card.appendChild(fb);
    const nb=document.createElement('button');nb.className='btn-next'+(ok?' sage':'');
    const isLast=S.qIdx===S.qDomande.length-1;
    nb.textContent=isLast?'🏁 Vedi il risultato':'➡️ Prossima domanda';
    nb.onclick=()=>{if(isLast){S.qFinito=true;saveRisultato('Quiz',S.qPunteggio,S.qDomande.length);}else{S.qIdx++;S.qRisposta=false;S.qScelta=null;}renderApp();};
    card.appendChild(nb);
  }
  app.appendChild(card);
}

// ══════════════════════════════════════════════════════════════
// MEMORIA / COPPIE
// ══════════════════════════════════════════════════════════════
function renderMemoria(app){
  if(S.mFinito){renderRisultato(app,'memoria','Coppie',S.mCards.length/2,S.mCards.length/2,`in ${S.mTentativi} tentativi`);return;}
  const card=document.createElement('div');card.className='card';
  card.innerHTML=`<div class="card-title">🃏 Abbina le coppie</div><div class="card-sub">Trova tutte le coppie uguali!</div>`;
  const info=document.createElement('div');info.className='mem-info';
  const paired=S.mMatched.length/2;
  info.innerHTML=`<div class="mem-stat"><div class="val">${paired}</div><div class="lbl">Trovate</div></div><div class="mem-stat"><div class="val">${S.mCards.length/2-paired}</div><div class="lbl">Rimaste</div></div><div class="mem-stat"><div class="val">${S.mTentativi}</div><div class="lbl">Tentativi</div></div>`;
  card.appendChild(info);
  const grid=document.createElement('div');grid.className='mem-grid';
  S.mCards.forEach((c,i)=>{
    const mc=document.createElement('div');mc.className='mem-card';mc.id='mc'+i;
    const isFl=S.mFlipped.includes(i),isMa=S.mMatched.includes(i);
    if(isFl||isMa)mc.classList.add('flipped');
    if(isMa)mc.classList.add('matched');
    mc.innerHTML=`<span class="mem-back">🌸</span><span class="mem-front">${c.em}</span>`;
    if(!isMa)mc.onclick=()=>flipCard(i);
    grid.appendChild(mc);
  });
  card.appendChild(grid);app.appendChild(card);
}
function flipCard(i){
  if(S.mLocked||S.mFlipped.includes(i)||S.mMatched.includes(i)||S.mFlipped.length>=2)return;
  S.mFlipped.push(i);
  const el=document.getElementById('mc'+i);if(el)el.classList.add('flipped');
  if(S.mFlipped.length===2){
    S.mTentativi++;S.mLocked=true;
    const[a,b]=S.mFlipped;
    setTimeout(()=>{
      if(S.mCards[a].em===S.mCards[b].em){
        S.mMatched.push(a,b);S.mFlipped=[];S.mLocked=false;
        if(S.mMatched.length===S.mCards.length){S.mFinito=true;saveRisultato('Coppie',S.mCards.length/2,S.mCards.length/2);}
        renderApp();
      }else{
        const ea=document.getElementById('mc'+a),eb=document.getElementById('mc'+b);
        if(ea)ea.classList.add('shake');if(eb)eb.classList.add('shake');
        setTimeout(()=>{S.mFlipped=[];S.mLocked=false;[ea,eb].forEach(el=>{if(el){el.classList.remove('flipped','shake');}});},600);
      }
    },700);
  }
}

// NUMERI
// ══════════════════════════════════════════════════════════════
function renderNumeri(app){
  const card=document.createElement('div');card.className='card';
  // Header
  const hdr=document.createElement('div');hdr.className='num-header';
  hdr.innerHTML=`<span class="num-lv">Livello ${S.nLivello} — ${S.nSequenza.length} cifre</span><span class="num-tentativi">Tentativo ${S.nTentativi+1}</span>`;
  card.appendChild(hdr);

  if(S.nFase==='guarda'){
    // Mostra la sequenza per 3 secondi poi nasconde
    const disp=document.createElement('div');disp.className='num-display';
    disp.innerHTML=`<div class="num-phase-label">Memorizza la sequenza</div><div class="num-seq" id="num-seq">${S.nSequenza.join(' ')}</div><div class="num-sub" id="num-sub">Scompare tra 3 secondi...</div>`;
    card.appendChild(disp);
    const istr=document.createElement('div');istr.className='num-istruzioni';
    istr.textContent='Guarda bene i numeri, poi dovrai ripeterli!';
    card.appendChild(istr);
    app.appendChild(card);

    // Timer conto alla rovescia
    let count=3;
    if(S.nTimer)clearInterval(S.nTimer);
    S.nTimer=setInterval(()=>{
      count--;
      const sub=document.getElementById('num-sub');
      if(sub)sub.textContent=count>0?`Scompare tra ${count} second${count===1?'o':'i'}...`:'Adesso scrivi!';
      if(count<=0){
        clearInterval(S.nTimer);S.nTimer=null;
        const seq=document.getElementById('num-seq');
        if(seq)seq.classList.add('hidden');
        setTimeout(()=>{S.nFase='scrivi';renderApp();},600);
      }
    },1000);

  } else if(S.nFase==='scrivi'){
    const disp=document.createElement('div');disp.className='num-display';
    disp.innerHTML=`<div class="num-phase-label">Scrivi la sequenza</div><div class="num-seq hidden">???</div><div class="num-sub">Usa il tastierino qui sotto</div>`;
    card.appendChild(disp);

    // Risposta inserita
    const risp=document.createElement('div');
    if(S.nInput.length>0){risp.className='num-risposta';risp.textContent=S.nInput.split('').join(' ');}
    else{risp.className='num-risposta placeholder';risp.textContent='Tocca i numeri...';}
    card.appendChild(risp);

    // Tastierino
    const kp=document.createElement('div');kp.className='num-keypad';
    [1,2,3,4,5,6,7,8,9,'✗',0,'✓'].forEach(k=>{
      const btn=document.createElement('button');
      if(k==='✗'){btn.className='num-key del';btn.textContent='✗';btn.onclick=()=>{S.nInput=S.nInput.slice(0,-1);renderApp();};}
      else if(k==='✓'){
        btn.className='num-key ok';btn.textContent='Conferma';
        btn.onclick=()=>{
          const corretto=S.nSequenza.join('')===S.nInput;
          S.nFase='risultato';S.nRisultato=corretto;
          if(corretto)saveRisultato('Numeri',1,1);
          renderApp();
        };
      } else{
        btn.className='num-key';btn.textContent=k;
        btn.onclick=()=>{if(S.nInput.length<S.nSequenza.length){S.nInput+=k;renderApp();}};
      }
      kp.appendChild(btn);
    });
    card.appendChild(kp);
    app.appendChild(card);

  } else if(S.nFase==='risultato'){
    const ok=S.nRisultato;
    const fb=document.createElement('div');fb.className='feedback-bar '+(ok?'ok':'ko');
    fb.style.fontSize='22px';fb.style.marginBottom='16px';
    fb.textContent=ok?'Bravissima! Sequenza corretta! 🏆':'Non ci siamo... 💪 Riprova!';
    card.appendChild(fb);

    // Mostra la sequenza corretta
    const disp=document.createElement('div');disp.className='num-display';
    disp.innerHTML=`<div class="num-phase-label">${ok?'La tua risposta':'Sequenza corretta'}</div><div class="num-seq">${S.nSequenza.join(' ')}</div>`;
    card.appendChild(disp);

    const btnRow=document.createElement('div');btnRow.style.display='flex';btnRow.style.flexDirection='column';btnRow.style.gap='10px';
    if(ok && S.nLivello<8){
      const btnSu=document.createElement('button');btnSu.className='btn-next sage';btnSu.textContent=`⬆️ Livello ${S.nLivello+1} — ${S.nSequenza.length+1} cifre`;
      btnSu.onclick=()=>{S.nTentativi=0;initNumeri(S.nLivello+1);renderApp();};btnRow.appendChild(btnSu);
    }
    const btnRi=document.createElement('button');btnRi.className=ok?'btn-outline':'btn-next';
    btnRi.textContent=ok?'🔄 Riprova stesso livello':`🔄 Riprova (${S.nSequenza.length} cifre)`;
    btnRi.onclick=()=>{S.nTentativi++;initNumeri(S.nLivello);renderApp();};btnRow.appendChild(btnRi);
    if(S.nLivello>1){
      const btnGiu=document.createElement('button');btnGiu.className='btn-outline';btnGiu.textContent=`⬇️ Torna al livello ${S.nLivello-1}`;
      btnGiu.onclick=()=>{S.nTentativi=0;initNumeri(S.nLivello-1);renderApp();};btnRow.appendChild(btnGiu);
    }
    card.appendChild(btnRow);
    app.appendChild(card);
  }
  if(S.nFase!=='scrivi'&&S.nFase!=='risultato'){}// già appended sopra
}

// ══════════════════════════════════════════════════════════════
// STORICO
// ══════════════════════════════════════════════════════════════
function calcStreak(storico){
  if(!storico.length)return 0;
  const byDay=new Set(storico.map(s=>s.data));
  const today=getTodayKey();
  if(!byDay.has(today))return 0;
  let streak=1;const d=new Date();
  for(let i=1;i<90;i++){d.setDate(d.getDate()-1);const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;if(byDay.has(k))streak++;else break;}
  return streak;
}
function renderStorico(app){
  const storico=S.storico,streak=calcStreak(storico);
  const card=document.createElement('div');card.className='card';
  card.innerHTML=`<div class="card-title">📊 I tuoi progressi</div><div class="card-sub">Continua così ogni giorno!</div>`;
  const sb=document.createElement('div');sb.className='streak-big';
  sb.innerHTML=`<span class="streak-fire">🔥</span><div class="streak-info"><div class="val">${streak} ${streak===1?'giorno':'giorni'}</div><div class="lbl">Striscia attuale</div></div>`;
  card.appendChild(sb);
  // Chart
  const chartTitle=document.createElement('div');chartTitle.style.cssText='font-size:13px;font-weight:700;color:var(--text-l);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;';chartTitle.textContent='Punteggi ultimi 7 giorni';card.appendChild(chartTitle);
  const chart=document.createElement('div');chart.className='chart';
  const today=getTodayKey();const d=new Date();
  for(let i=6;i>=0;i--){
    const dd=new Date(d);dd.setDate(d.getDate()-i);
    const key=`${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}-${String(dd.getDate()).padStart(2,'0')}`;
    const gl=['Do','Lu','Ma','Me','Gi','Ve','Sa'][dd.getDay()];
    const gr=storico.filter(s=>s.data===key);
    const avg=gr.length?Math.round(gr.reduce((a,s)=>a+(s.punteggio/s.totale)*100,0)/gr.length):0;
    const wrap=document.createElement('div');wrap.className='bar-wrap';
    const col=document.createElement('div');col.className='bar-col '+(avg>0?(key===today?'today':'has-data'):'empty');col.style.height=`${Math.max(avg,4)}%`;
    const dayL=document.createElement('div');dayL.className='bar-day';dayL.textContent=gl;
    const valL=document.createElement('div');valL.className='bar-val';valL.textContent=avg>0?avg+'%':'';
    wrap.appendChild(valL);wrap.appendChild(col);wrap.appendChild(dayL);chart.appendChild(wrap);
  }
  card.appendChild(chart);app.appendChild(card);
  // Lista
  if(storico.length>0){
    const lc=document.createElement('div');lc.className='card';lc.innerHTML='<div class="card-title" style="margin-bottom:12px">Ultime partite</div>';
    const icons={Quiz:'🧩',Coppie:'🃏',Frasi:'📜',Numeri:'🔢'};
    [...storico].reverse().slice(0,8).forEach(s=>{
      const perc=Math.round((s.punteggio/s.totale)*100);
      const row=document.createElement('div');row.className='game-row';
      row.innerHTML=`<div class="game-row-left"><span class="game-row-icon">${icons[s.tipo]||'🎮'}</span><div><div class="game-row-name">${s.tipo}</div><div class="game-row-date">${s.data}</div></div></div><span class="game-row-score">${perc}%</span>`;
      lc.appendChild(row);
    });
    app.appendChild(lc);
  }else{
    const em=document.createElement('div');em.className='card';em.innerHTML='<div class="no-data">🌸 Nessuna partita ancora.<br>Inizia a giocare per vedere i progressi!</div>';app.appendChild(em);
  }
}

// RISULTATO GENERICO
// ══════════════════════════════════════════════════════════════
function renderRisultato(app,tipo,nomeGioco,p,tot,extra=''){
  const perc=Math.round((p/tot)*100);
  let em,titolo,testo;
  if(perc===100){em='🏆';titolo='Perfetto!';testo='Tutte le risposte giuste. Sei straordinaria!';}
  else if(perc>=60){em='⭐';titolo='Molto bene!';testo='Ottimo risultato oggi. Sei fantastica!';}
  else{em='💛';titolo='Bravo tentativo!';testo='Ogni giorno si migliora. Sei bravissima lo stesso!';}
  const card=document.createElement('div');card.className='card';card.style.textAlign='center';card.style.padding='28px 18px';
  card.innerHTML=`<span class="result-emoji">${em}</span><div class="result-title">${titolo}</div><div class="result-sub">${testo}${extra?`<br><small style="color:var(--text-l)">${extra}</small>`:''}</div><span class="result-score">${p} / ${tot}</span><div class="result-label">risposte corrette</div>`;
  const btns=document.createElement('div');btns.style.cssText='display:flex;flex-direction:column;gap:8px;';
  const b1=document.createElement('button');b1.className='btn-next sky';b1.textContent='🎵 Vai alla musica';b1.onclick=()=>{S.tab='musica';renderApp();};
  const b2=document.createElement('button');b2.className='btn-outline';b2.textContent='🔄 Rigioca';
  b2.onclick=()=>{
    if(tipo==='quiz')initQuiz();
    else if(tipo==='memoria')initMemoria();
    else if(tipo==='frasi')initFrasi();
    else if(tipo==='numeri')initNumeri(S.nLivello);
    renderApp();
  };
  const b3=document.createElement('button');b3.className='btn-outline';b3.textContent='📊 Vedi i progressi';b3.onclick=()=>{S.tab='storico';renderApp();};
  btns.appendChild(b1);btns.appendChild(b2);btns.appendChild(b3);card.appendChild(btns);app.appendChild(card);
}

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════
initQuiz();initMemoria();initFrasi();initNumeri(1);
renderApp();
</script>
</body>
</html>
